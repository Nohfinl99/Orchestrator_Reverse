name: Verify public documents

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify document inventory, preservation and navigation
        run: python3 -I -B scripts/verify_ia.py
